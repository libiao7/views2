name: Android build

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - feature/vr180-sbs-opengl
      - feature/vr180-cross-screen-fov-ipd
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: bash ./gradlew --no-daemon assembleDebug

      - name: Name APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          apk_path="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [[ -z "$apk_path" ]]; then
            echo "No APK found."
            exit 1
          fi

          timestamp="$(TZ=Asia/Taipei date '+%Y年%-m月%-d日%H点%M分')"
          tag_timestamp="$(TZ=Asia/Taipei date '+%Y%m%d-%H%M')"
          short_sha="${GITHUB_SHA:0:7}"
          filename="views1-arm64-v8a-debug-${timestamp}-${short_sha}.apk"
          output_path="app/build/outputs/apk/debug/${filename}"
          mv "$apk_path" "$output_path"

          branch_slug="${GITHUB_REF_NAME//\//-}"
          tag="build-${branch_slug}-${tag_timestamp}-${short_sha}-run-${GITHUB_RUN_ID}"

          echo "path=$output_path" >> "$GITHUB_OUTPUT"
          echo "name=${filename%.apk}" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: views2-debug-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14

      - name: Prepare branch-specific release tag
        id: release
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.actor == 'libiao7')
        uses: actions/github-script@v7
        with:
          script: |
            const tag = "${{ steps.apk.outputs.tag }}";
            const ref = `tags/${tag}`;

            try {
              await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref
              });
              await github.rest.git.updateRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref,
                sha: context.sha,
                force: true
              });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/${ref}`,
                sha: context.sha
              });
            }

            core.setOutput("tag", tag);

      - name: Publish APK to branch Release
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.actor == 'libiao7')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.apk.outputs.name }}
          body: |
            Automatically built Android Debug APK.

            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
          files: ${{ steps.apk.outputs.path }}
          overwrite_files: true
          fail_on_unmatched_files: true
          make_latest: false
