name: Android build

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - feature/vr180-sbs-opengl
      - feature/vr180-cross-screen-fov-ipd
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: bash ./gradlew --no-daemon assembleDebug

      - name: Prepare branch-specific release tag
        id: release
        if: github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.ref.replace(/^refs\\/heads\\//, "");
            const tag = `build-${branch.replaceAll("/", "-")}`;
            const ref = `tags/${tag}`;

            try {
              await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref
              });
              await github.rest.git.updateRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref,
                sha: context.sha,
                force: true
              });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/${ref}`,
                sha: context.sha
              });
            }

            core.setOutput("tag", tag);

      - name: Publish APK to branch Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: Android Debug - ${{ github.ref_name }}
          body: |
            Automatically built Android Debug APK.

            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
          files: app/build/outputs/apk/debug/*.apk
          overwrite_files: true
          fail_on_unmatched_files: true
          make_latest: false
